
# ---------------------------------------------------------------------------------------------
# Audita (sistemas do Vinícius: Audita PRO, Audita HUB e Sistema AUDITA) — fora da tela do NPM, criado em 21/10/2026.
# HTTPS aqui; tudo segue em HTTP para o container "audita-proxy" (rede npm_default, ~/audita/proxy), que aplica as
# regras de cada sistema. Certificados: certbot por DNS do Cloudflare (--cert-name audita-pro, audita-hub,
# audita-sistema), renovados pelo crontab do usuário deploy (~/audita/renovar-certificados.sh).
# ---------------------------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name auditapro.app.br www.auditapro.app.br api.auditapro.app.br auditahub.app.br www.auditahub.app.br
              audita.seg.br www.audita.seg.br api.audita.seg.br;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name auditapro.app.br www.auditapro.app.br api.auditapro.app.br;
  ssl_certificate /etc/letsencrypt/live/audita-pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/audita-pro/privkey.pem;
  include conf.d/include/ssl-ciphers.conf;
  include /data/nginx/custom/audita-proxy[.]inc;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name auditahub.app.br www.auditahub.app.br;
  ssl_certificate /etc/letsencrypt/live/audita-hub/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/audita-hub/privkey.pem;
  include conf.d/include/ssl-ciphers.conf;
  include /data/nginx/custom/audita-proxy[.]inc;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name audita.seg.br www.audita.seg.br api.audita.seg.br;
  ssl_certificate /etc/letsencrypt/live/audita-sistema/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/audita-sistema/privkey.pem;
  include conf.d/include/ssl-ciphers.conf;
  include /data/nginx/custom/audita-proxy[.]inc;
}
