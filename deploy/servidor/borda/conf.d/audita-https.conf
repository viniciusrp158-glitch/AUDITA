# HTTPS dos 3 sistemas Audita (adaptado de referencia-vps1/npm-custom-audita.conf, que rodava dentro do NPM da VPS 1).
# Tudo segue em HTTP para o audita-proxy, que aplica as regras de cada sistema.

resolver 127.0.0.11 valid=30s ipv6=off;
server_tokens off;
client_max_body_size 60m;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:audita_ssl:10m;
ssl_session_timeout 1d;

server {
  listen 80;
  listen [::]:80;
  server_name auditapro.app.br www.auditapro.app.br api.auditapro.app.br auditahub.app.br www.auditahub.app.br
              audita.seg.br www.audita.seg.br api.audita.seg.br;
  location / { return 301 https://$host$request_uri; }
}

# Qualquer outro nome: recusa (não expõe os sistemas por IP ou domínio desconhecido)
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name auditapro.app.br www.auditapro.app.br api.auditapro.app.br;
  ssl_certificate /etc/letsencrypt/live/audita-pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/audita-pro/privkey.pem;
  include /etc/nginx/conf.d/repasse.inc;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name auditahub.app.br www.auditahub.app.br;
  ssl_certificate /etc/letsencrypt/live/audita-hub/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/audita-hub/privkey.pem;
  include /etc/nginx/conf.d/repasse.inc;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name audita.seg.br www.audita.seg.br api.audita.seg.br;
  ssl_certificate /etc/letsencrypt/live/audita-sistema/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/audita-sistema/privkey.pem;
  include /etc/nginx/conf.d/repasse.inc;
}
