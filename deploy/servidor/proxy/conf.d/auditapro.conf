# Audita PRO — adaptado de deploy/vps/nginx-auditapro.conf (repositório AuditaPRO). HTTPS na borda (../../borda).

server {
    listen 80;
    server_name www.auditapro.app.br;
    access_log /var/log/nginx/auditapro/access.log apro_acesso;
    return 301 https://auditapro.app.br$request_uri;
}

server {
    listen 80;
    server_name auditapro.app.br;
    access_log /var/log/nginx/auditapro/access.log apro_acesso;

    root /home/deploy/audita/auditapro/www/current;
    index audita-pro-login.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = / { return 302 /audita-pro-login.html; }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location ^~ /email-templates/ {
        alias /home/deploy/audita/auditapro/email/;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /caixa-de-testes/ {
        auth_basic "Audita PRO - caixa de testes";
        auth_basic_user_file /etc/nginx/htpasswd/auditapro-caixa.htpasswd;
        set $mailpit http://auditapro-mailpit:8025;
        proxy_pass $mailpit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /homologacao { return 301 /homologacao/; }
    location = /homologacao/ { return 302 /homologacao/audita-pro-login.html; }
    location ^~ /homologacao/ {
        alias /home/deploy/audita/auditapro/homologacao/current/;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location ~ /\. { deny all; }
}

# API do Supabase do PRO + HUB (container supabase-envoy). Só as APIs públicas; o Studio fica fechado
# (túnel: ssh -p 58212 -L 8000:127.0.0.1:8000 deploy@109.205.179.53 → http://localhost:8000).
server {
    listen 80;
    server_name api.auditapro.app.br;
    access_log /var/log/nginx/auditapro/access.log apro_acesso;
    client_max_body_size 60m;

    location ~ ^/(auth|rest|storage|functions|realtime|graphql)/v1/ {
        set $api http://supabase-envoy:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / { return 404; }
}
