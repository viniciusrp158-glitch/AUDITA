# Base comum aos 3 sistemas Audita.

# DNS interno do Docker: os upstreams são resolvidos na hora (o Nginx sobe mesmo com um serviço parado).
resolver 127.0.0.11 valid=10s ipv6=off;

# IP real: a borda (rede Docker) repassa X-Forwarded-For; atrás do proxy do Cloudflare (audita.seg.br) a lista também traz
# o IP do Cloudflare, que é ignorado por estar entre as faixas confiáveis.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# O HTTPS termina na borda: repassa o esquema original (https) em vez do http interno.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Audita PRO — registro de acesso (Marco Civil, art. 15), mesmo formato da VPS original.
log_format apro_acesso '$time_iso8601 ip=$remote_addr porta=$remote_port cf_ip=$http_cf_connecting_ip '
                       'host=$host metodo=$request_method caminho=$uri status=$status bytes=$body_bytes_sent '
                       'cf_ray=$http_cf_ray ua="$http_user_agent"';

server_tokens off;
# Redirecionamentos relativos: o HTTPS termina na borda, então um Location absoluto sairia como http://.
absolute_redirect off;

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
