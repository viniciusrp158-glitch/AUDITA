# Audita HUB — adaptado de deploy/vps/nginx-auditahub.conf (repositório AUDITAHUB). HTTPS na borda (../../borda).
server {
    listen 80;
    server_name www.auditahub.app.br;
    return 301 https://auditahub.app.br$request_uri;
}
server {
    listen 80;
    server_name auditahub.app.br;

    # Evidências e documentos: até 4 MB por arquivo; as Server Actions aceitam 5 MB.
    client_max_body_size 6m;

    location / {
        set $hub http://auditahub-web:3300;
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        # O "next start" monta redirecionamentos com a própria origem interna; reescreve para caminho relativo.
        proxy_redirect http://localhost:3300/ /;
        proxy_redirect http://127.0.0.1:3300/ /;
        proxy_redirect http://0.0.0.0:3300/ /;
        proxy_redirect http://auditahub-web:3300/ /;
        proxy_redirect https://localhost:3300/ /;
        proxy_redirect https://127.0.0.1:3300/ /;
    }
}
