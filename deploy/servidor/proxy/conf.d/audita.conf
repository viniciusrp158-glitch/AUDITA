# Sistema AUDITA — adaptado de deploy/vps/nginx-audita-sistema.conf (repositório AUDITA). HTTPS na borda (../../borda).
server {
    listen 80;
    server_name audita.seg.br www.audita.seg.br;
    client_max_body_size 60m;

    # Endereço canônico: www redireciona para audita.seg.br (briefing 10.7), mantendo o caminho
    if ($host = www.audita.seg.br) { return 301 https://audita.seg.br$request_uri; }

    location ^~ /email-templates/ {
        alias /srv/audita-email/;
        add_header Cache-Control "no-cache" always;
    }
    # A antiga caixa de e-mails de teste (/caixa-de-testes/ → audita-mailpit) foi retirada (auditoria de segurança,
    # 25/10/2026): o e-mail do AUDITA sai pelo Brevo, e a caixa ficava na mesma origem das sessões da equipe e do aluno.
    location ~ /\.(?!well-known/) { deny all; }

    # Aviso de pagamento do Mercado Pago -> função "mercadopago", direto (sem o gateway, que troca o x-request-id usado
    # na assinatura). Só POST; a função confere a assinatura e busca o pagamento na API do Mercado Pago.
    location = /pagamentos/mercadopago {
        limit_except POST { deny all; }
        set $mp http://audita-functions:9000;
        rewrite ^ /mercadopago break;
        proxy_pass $mp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # Área do aluno dos treinamentos (container audita-aluno)
    location ^~ /treinamentos {
        set $aluno http://audita-aluno:3300;
        proxy_pass $aluno;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Sistema da equipe (basePath /empresa)
    location ^~ /empresa {
        set $web http://audita-web:3200;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Endereços antigos do sistema (antes do /empresa) continuam levando a ele
    location ~ ^/(login|recuperar-senha|atualizar-senha|auth|cadastro|verificacao|sem-acesso|clientes|orcamentos|demandas|biblioteca|caixa|comunicacao|configuracoes|conta)(/|$) {
        return 302 /empresa$request_uri;
    }

    # Site institucional (container audita-site): tudo o que não é dos blocos acima
    location / {
        set $site http://audita-site:8080;
        proxy_pass $site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
    }
}

# API do Supabase do AUDITA (container audita-api-gw). Studio fechado
# (túnel: ssh -p 58212 -L 8100:127.0.0.1:8100 deploy@109.205.179.53 → http://localhost:8100).
server {
    listen 80;
    server_name api.audita.seg.br;
    client_max_body_size 60m;

    location ~ ^/(auth|rest|storage|functions|realtime|graphql)/v1/ {
        set $api http://audita-api-gw:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location / { return 404; }
}
