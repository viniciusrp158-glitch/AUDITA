# Nginx do container audita-site: só arquivos estáticos do site institucional. O audita-proxy manda para cá tudo o que
# não é /empresa, /treinamentos, /pagamentos/mercadopago, /email-templates nem /caixa-de-testes.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirecionamentos relativos (/contato -> /contato/): o container escuta na 8080 atrás do proxy, e um endereço
    # absoluto levaria o visitante a http://audita.seg.br:8080/...
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Prévia: fora dos buscadores até a publicação autorizada (briefing, Etapa 7). Remover na publicação.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    error_page 404 /404.html;
}
