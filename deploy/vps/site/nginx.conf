# Nginx do container audita-site: só arquivos estáticos do site institucional. O audita-proxy manda para cá tudo o que
# não é /empresa, /treinamentos, /pagamentos/mercadopago, /email-templates nem /caixa-de-testes.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirecionamentos relativos (/contato -> /contato/): o container escuta na 8080 atrás do proxy, e um endereço
    # absoluto levaria o visitante a http://audita.seg.br:8080/...
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Logos, telas dos sistemas e ícones: trocados sempre com nome novo, então 30 dias (Cloudflare e navegador).
    # Fotos definitivas (images/site), trocadas mantendo o nome: 1 dia, e até 7 dias servidas na hora enquanto renovam.
    location ~ ^/(images/(marca|plataformas)/|favicon\.ico$|icon\.png$|apple-icon\.png$|opengraph-image\.png$) {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /images/site/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Audita Academy (planejamento aprovado pelo Diretor, 16/11/2026): endereços curtos para a plataforma de treinamentos
    location ~ ^/cursos/?$ { return 301 /treinamentos/cursos; }
    location ~ ^/cursos/(.+)$ { return 301 /treinamentos/cursos/$1; }
    location ~ ^/(auditaacademy|academy)/?$ { return 301 /treinamentos/; }

    location / {
        try_files $uri $uri/ =404;
        # Páginas: o navegador guarda e confere a cada visita (resposta 304, sem baixar de novo). Sem prazo de validade porque
        # uma página antiga apontaria para arquivos de código que deixam de existir na publicação seguinte.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    error_page 404 /404.html;
}
