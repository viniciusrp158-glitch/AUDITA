# Cópia de referência do arquivo em uso na VPS (/etc/nginx/sites-available/audita-sistema), já com o HTTPS que o certbot
# acrescentou. Para uma VPS nova, use nginx-audita-sistema.conf e rode o certbot (ver MIGRAR-VPS.md); este arquivo só serve
# para conferência ou para restaurar quando os certificados de /etc/letsencrypt também forem copiados.

# Sistema AUDITA de Operação — /etc/nginx/sites-available/audita-sistema (link em sites-enabled).
# Arquivo próprio: não altera o do Audita PRO. O map $connection_upgrade já vem do arquivo do PRO (não redefinir).
# Aplicar com: nginx -t && systemctl reload nginx. O HTTPS é acrescentado pelo certbot (--nginx --redirect).

# Site: o sistema (Next.js com servidor, container audita-web em 127.0.0.1:3200) em /empresa; a raiz leva a /empresa.
server {
    server_name audita.seg.br www.audita.seg.br;
    client_max_body_size 60m;

    location = / { return 302 /empresa; }
    # Modelos de e-mail do Auth (lidos pelo container audita-auth)
    location ^~ /email-templates/ {
        alias /var/www/audita-email/;
        add_header Cache-Control "no-cache" always;
    }
    location ~ /\.(?!well-known/) { deny all; }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/audita.seg.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/audita.seg.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# API do Supabase do AUDITA (api-gw em 127.0.0.1:8100). Só as APIs públicas; o Studio fica fechado
# (acesso por túnel: ssh -L 8100:127.0.0.1:8100 root@164.68.112.61).
server {
    server_name api.audita.seg.br;
    client_max_body_size 60m;

    location ~ ^/(auth|rest|storage|functions|realtime|graphql)/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location / { return 404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/audita.seg.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/audita.seg.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.audita.seg.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = audita.seg.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name audita.seg.br www.audita.seg.br;
    return 404; # managed by Certbot




}
server {
    if ($host = api.audita.seg.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.audita.seg.br;
    return 404; # managed by Certbot


}